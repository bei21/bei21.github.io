{%- if jekyll.environment == 'production' and site.enable_google_analytics and site.google_analytics -%}
  <!-- Load analytics only on the public site, including when previews use production builds. -->
  <script>
    (function () {
      if (window.location.hostname !== new URL({{ site.url | jsonify }}).hostname) return;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', {{ site.google_analytics | jsonify }});

      var script = document.createElement('script');
      script.async = true;
      script.src = {{ 'https://www.googletagmanager.com/gtag/js?id=' | append: site.google_analytics | jsonify }};
      document.head.appendChild(script);
    })();
  </script>
{%- endif -%}
{%- if site.enable_cronitor_analytics -%}
  <!-- Cronitor RUM -->
  <script async src="https://rum.cronitor.io/script.js"></script>
  <script>
    window.cronitor = window.cronitor || function() { (window.cronitor.q = window.cronitor.q || []).push(arguments); };
    cronitor('config', { clientKey: '{{site.cronitor_analytics}}' });
  </script>
{%- endif -%}
